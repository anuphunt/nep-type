[package]
name = "neptype-engine"
version = "0.2.0"
edition = "2021"
license = "MIT"

[lib]
name = "neptype_engine"
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
regex = "1"
serde = {version = "1", features = ["derive"]}
serde_json = "1"
sha2 = "0.10"
unicode-segmentation = "1"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
lto = true
opt-level = "s"
strip = "debuginfo"
