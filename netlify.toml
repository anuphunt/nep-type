[build]
  base = "landing-page"
  # Shared Rust and dictionary changes live outside the website directory.
  ignore = "exit 1"
  command = "npm test && node build.mjs"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[[redirects]]
  from = "https://neptype-app.netlify.app/*"
  to = "https://neptype.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[redirects]]
  from = "/:page/index.html"
  to = "/:page/"
  status = 301
  force = true

[[redirects]]
  from = "/ne/:page/index.html"
  to = "/ne/:page/"
  status = 301
  force = true

[[headers]]
  for = "/engine/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
