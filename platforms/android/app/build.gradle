plugins { id 'com.android.application' }

android {
    namespace 'app.lekha.keyboard'
    compileSdk 35
    // FileChannel lookups require uncompressed, seekable APK asset segments.
    androidResources { noCompress += ['tsv'] }
    defaultConfig {
        applicationId 'app.lekha.keyboard.prototype'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1-dev'
    }
}
